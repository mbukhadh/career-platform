<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Career Platform{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/site.css') }}">
  </head>
  <body>
    {% block content %}{% endblock %}
    <div id="consent-banner" class="consent-banner" role="region" aria-label="Cookie choice" hidden>
      <p>May this site use Google Analytics cookies to count page views and link clicks? Nothing loads unless you accept. <a href="/privacy">Privacy</a></p>
      <div class="consent-actions">
        <button type="button" data-consent="accepted">Accept</button>
        <button type="button" data-consent="declined">Decline</button>
      </div>
    </div>
    <script src="{{ url_for('static', path='js/consent.js') }}" defer></script>
  </body>
</html>
