{% if projects is none %}
  <p class="projects-unavailable" role="status">Projects temporarily unavailable</p>
{% elif projects %}
  {% for project in projects %}
  <article>
    <h3>{{ project.name }}</h3>
    <p>{{ project.description }}</p>
    {% if project.url %}<a href="{{ project.url }}">View {{ project.name }}</a>{% endif %}
  </article>
  {% endfor %}
{% else %}<p>No projects published yet.</p>{% endif %}
