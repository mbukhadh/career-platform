<form class="contact-form" method="post" action="/contact">
  <div class="field">
    <label for="contact-name">Name</label>
    <input id="contact-name" name="name" required maxlength="120" autocomplete="name">
  </div>
  <div class="field">
    <label for="contact-email">Email</label>
    <input id="contact-email" name="email" type="email" required autocomplete="email">
  </div>
  <div class="field">
    <label for="contact-message">Message</label>
    <textarea id="contact-message" name="message" required maxlength="5000"></textarea>
  </div>
  <div class="honeypot" aria-hidden="true">
    <label for="contact-hp">Leave this field empty</label>
    <input id="contact-hp" name="honeypot" tabindex="-1" autocomplete="off">
  </div>
  <button type="submit">Send message</button>
</form>
