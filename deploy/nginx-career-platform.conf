# Installed as /etc/nginx/sites-available/career-platform and linked into
# sites-enabled. Nginx is the only public entry point; it hands every request
# to Uvicorn on the loopback address. server_name is the test subdomain
# (section 7). The HTTPS lines and the port-80 redirect block below were added
# by Certbot on 2026-11-05 ("managed by Certbot"); the bare IP now gets 404.
server {
    server_name aws.mjbukhadhour.com;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/aws.mjbukhadhour.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/aws.mjbukhadhour.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = aws.mjbukhadhour.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80 default_server;
    listen [::]:80 default_server;
    server_name aws.mjbukhadhour.com;
    return 404; # managed by Certbot


}

# Production name, added 2026-11-05 (section 8). First certificate issued by
# DNS-01 before cutover; after the apex moved here, `certbot --nginx` reissued
# it and renewal now uses the nginx plugin (HTTP-01).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mjbukhadhour.com;
    ssl_certificate /etc/letsencrypt/live/mjbukhadhour.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/mjbukhadhour.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

}

server {
    if ($host = mjbukhadhour.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name mjbukhadhour.com;
    return 301 https://$host$request_uri;


}
